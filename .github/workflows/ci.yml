name: CI

on:
  # long-lived branches only, so a pull request doesn't run twice
  push:
    branches: [main, v6]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    uses: getkirby/actions/.github/workflows/php.yml@e27f4dff8102d3f51e08f0608f27decf59a90ce8 # 0.3.1
    with:
      composer-normalize: true
      extensions: gd, mbstring
      suggestions: true
    permissions:
      contents: read
      # for the code style suggestions on pull requests
      pull-requests: write
